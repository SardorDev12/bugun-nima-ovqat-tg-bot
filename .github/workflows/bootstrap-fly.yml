name: Bootstrap Fly App (run once)

on:
  workflow_dispatch: {}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create Fly app (skips if it already exists)
        run: flyctl apps create nimaovqat || echo "App already exists, continuing."
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Set app secrets
        run: |
          flyctl secrets set \
            BOT_TOKEN="${{ secrets.BOT_TOKEN }}" \
            DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            WEBHOOK_SECRET="${{ secrets.WEBHOOK_SECRET }}" \
            PUBLIC_URL="https://nimaovqat.fly.dev" \
            -a nimaovqat
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
